<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف ملكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #d4af37; 
            --dark: #0a0a0a; 
            --white: #ffffff;
        }

        body { 
            margin: 0; 
            background: var(--dark); 
            color: var(--gold); 
            text-align: center; 
            font-family: 'Amiri', serif; /* الخط الأساسي الملكي */
            overflow-x: hidden;
        }

        .royal-bg { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1350&q=80'); 
            background-size: cover; 
            z-index: -1; 
        }

        .container { 
            max-width: 450px; 
            margin: 50px auto; 
            padding: 40px 20px; 
            border: 3px double var(--gold); 
            background: rgba(10, 10, 10, 0.9); 
            border-radius: 30px; 
            box-shadow: 0 0 50px rgba(212,175,55,0.3);
            position: relative;
        }

        /* إضافة زوايا مزخرفة */
        .container::before, .container::after {
            content: "✨";
            position: absolute;
            font-size: 2rem;
        }
        .container::before { top: 10px; right: 10px; }
        .container::after { bottom: 10px; left: 10px; }

        h1 { 
            font-size: 2.8rem; 
            margin: 10px 0; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .names {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: var(--white);
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .heart-icon {
            color: #e31b23;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .details-box {
            font-family: 'Cairo', sans-serif; /* خط عصري للمعلومات */
            font-size: 1.1rem; 
            color: #eee; 
            margin: 30px 0;
            line-height: 2;
        }

        .btn { 
            display: inline-block; 
            padding: 12px 40px; 
            background: linear-gradient(45deg, #d4af37, #f9f295, #d4af37);
            color: #000; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212,175,55,0.6);
        }

        #overlay { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--dark); 
            z-index: 9999; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }

        .sticker {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="royal-bg"></div>

<div id="overlay">
    <div class="sticker">🤵‍♂️👰‍♀️</div>
    <h1 style="color: var(--gold); font-family: 'Amiri';">دعوة زفاف فخمة</h1>
    <button class="btn" onclick="startInvitation()">اضغط لفتح الدعوة ✉️</button>
</div>

<div class="container">
    <p style="font-size: 1.3rem;">بِسْمِ اللَّـهِ الرَّحْمَـٰنِ الرَّحِيمِ</p>
    <p>نتشرف بدعوتكم لمشاركتنا فرحة العمر</p>
    
    <div class="names">
        <span>العريس</span>
        <span class="heart-icon">❤️</span>
        <span>العروس</span>
    </div>

    <div class="details-box">
        <p>💍 <strong>العروسان:</strong> ولد & بنت</p>
        <p>📅 <strong>التاريخ:</strong> الاثنين، 1 يونيو 2026</p>
        <p>📍 <strong>المكان:</strong> قاعة اهالينا للمناسبات</p>
        <p>⚜️ حضوركم يتمم فرحتنا ⚜️</p>
    </div>

    <a href="https://maps.google.com" class="btn" target="_blank">📍 موقع القاعة على الخريطة</a>
    
    <div style="margin-top: 30px; font-size: 0.9rem; opacity: 0.7;">
        ✨ والعاقبة لديكم بالمسرات ✨
    </div>
</div>

<audio id="bgMusic" preload="auto" loop>
    <source src="https://files.catbox.moe/iz2b6c.mp3" type="audio/mpeg">
</audio>

<script>
    function startInvitation() {
        document.getElementById('overlay').style.fadeOut = "slow";
        document.getElementById('overlay').style.display = 'none';
        var audio = document.getElementById('bgMusic');
        audio.play().catch(err => {
            console.log("الرجاء التفاعل مع الصفحة لتشغيل الصوت");
        });
    }
</script>

</body>
</html>
