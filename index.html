<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف مصطفى واية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark: #0a0a0a;
            --white: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Amiri', serif;
            background: var(--dark);
            color: var(--gold);
            text-align: center;
            overflow-x: hidden;
        }

        /* خلفية القاعة الملكية */
        .royal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            padding: 30px;
            border: 2px solid var(--gold);
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            animation: fadeIn 2s ease-in;
        }

        h1 { font-size: 3rem; margin: 10px 0; color: var(--gold); }
        h2 { font-size: 1.5rem; color: var(--white); font-family: 'Cairo', sans-serif; }

        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            direction: ltr;
        }
        .time-box {
            border: 1px solid var(--gold);
            padding: 10px;
            border-radius: 10px;
            min-width: 70px;
            background: rgba(212, 175, 55, 0.1);
        }
        .time-box span { display: block; font-size: 1.8rem; font-weight: bold; color: var(--white); }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            background: var(--gold);
            color: var(--dark);
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        /* واجهة الدخول الإجبارية لتشغيل الصوت */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="royal-bg"></div>

<div id="overlay">
    <img src="https://img.icons8.com/ios/100/d4af37/wedding-rings.png" style="margin-bottom: 20px;">
    <h1 style="font-size: 2.2rem; color: var(--gold);">زفاف مصطفى واية</h1>
    <p style="color: var(--white); margin-bottom: 20px;">ننتظركم بكل حب في ليلة العمر</p>
    <button class="btn" onclick="startInvitation()">اضغط لسماع الزفة ودخول الدعوة ✉️</button>
</div>

<div class="container">
    <p style="color: var(--white); font-size: 1.1rem;">نتشرف بدعوتكم لمشاركتنا فرحتنا</p>
    <h1>مصطفى & اية</h1>
    <h2>زفة حسين الجسمي ترافق ليلة عمرنا</h2>
    
    <div style="font-size: 1.2rem; color: var(--white); margin: 25px 0;">
        <p>📅 الاثنين، 1 يونيو 2026</p>
        <p>🕒 الساعة الخامسة مساءً</p>
        <p>📍 قاعة اهالينا للمناسبات</p>
    </div>

    <div id="countdown">
        <div class="time-box"><span id="days">0</span>يوم</div>
        <div class="time-box"><span id="hours">0</span>ساعة</div>
        <div class="time-box"><span id="minutes">0</span>دقيقة</div>
    </div>

    <a href="https://maps.google.com" class="btn" target="_blank">📍 موقع القاعة على الخريطة</a>
</div>

<audio id="bgMusic" loop>
    <source src="https://files.catbox.moe/iz2b6c.mp3" type="audio/mpeg">
</audio>

<script>
    function startInvitation() {
        // إخفاء واجهة الدخول
        document.getElementById('overlay').style.display = 'none';
        
        // تشغيل الموسيقى
        var audio = document.getElementById('bgMusic');
        audio.play().catch(function(error) {
            console.log("حدث خطأ في تشغيل الصوت: ", error);
        });
    }

    // العداد التنازلي
    const weddingDate = new Date("June 1, 2026 17:00:00").getTime();
    setInterval(function() {
        const now = new Date().getTime();
        const distance = weddingDate - now;
        document.getElementById("days").innerHTML = Math.floor(distance / (1000 * 60 * 60 * 24));
        document.getElementById("hours").innerHTML = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById("minutes").innerHTML = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    }, 1000);
</script>

</body>
</html>
