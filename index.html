<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف مصطفى واية</title>
    <style>
        /* ... التصميم الملكي ... */
        :root { --gold: #d4af37; --dark: #0a0a0a; }
        body { margin: 0; background: var(--dark); color: var(--gold); text-align: center; font-family: 'Amiri', serif; }
        .royal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1350&q=80'); background-size: cover; z-index: -1; }
        .container { max-width: 450px; margin: 40px auto; padding: 30px; border: 2px solid var(--gold); background: rgba(0, 0, 0, 0.85); border-radius: 20px; box-shadow: 0 0 30px rgba(212,175,55,0.4); }
        .btn { display: inline-block; padding: 15px 35px; background: var(--gold); color: var(--dark); text-decoration: none; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="royal-bg"></div>

<div id="overlay">
    <h1 style="color: var(--gold);">زفاف مصطفى واية</h1>
    <button class="btn" onclick="startInvitation()">تفضلوا بالدخول ✉️</button>
</div>

<div class="container">
    <p>نتشرف بدعوتكم لمشاركتنا فرحتنا</p>
    <h1>مصطفى & اية</h1>
    <div style="font-size: 1.2rem; color: #fff; margin: 25px 0;">
        <p>📅 الاثنين، 1 يونيو 2026</p>
        <p>📍 قاعة اهالينا للمناسبات</p>
    </div>
    <a href="https://maps.google.com" class="btn" target="_blank">📍 موقع القاعة</a>
</div>

<audio id="bgMusic" preload="auto" loop>
    <source src="https://www.mboxdrive.com/iz2b6c.mp3" type="audio/mpeg">
    <source src="https://files.catbox.moe/iz2b6c.mp3" type="audio/mpeg">
</audio>

<script>
    function startInvitation() {
        document.getElementById('overlay').style.display = 'none';
        var audio = document.getElementById('bgMusic');
        
        // محاولة تشغيل الصوت بأكثر من طريقة لضمان الاستجابة
        audio.play().then(() => {
            console.log("الزفة تعمل!");
        }).catch(err => {
            console.log("فشل التشغيل التلقائي، سيتم المحاولة مرة أخرى");
            // محاولة ثانية في حال رفض المتصفح
            window.addEventListener('click', () => { audio.play(); }, {once: true});
        });
    }
</script>

</body>
</html>
